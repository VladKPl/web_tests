[pytest]
testpaths = tests
addopts = --strict-markers --alluredir=allure-results
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
markers =
    auth: Registration and authentication
    cart: Shopping cart
    order: Checkout and payment
    subscription: Email subscription
    security: Safe UI validation
    smoke: Essential checks
    regression: Regression checks
